services:
  db:
    image: postgres:16-alpine
    container_name: payrecon-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-payrecon}
      POSTGRES_USER: ${POSTGRES_USER:-payrecon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting Docker Compose}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: payrecon-backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-payrecon}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-payrecon}
      INVESTIGATION_LLM_PROVIDER: ${INVESTIGATION_LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      INVESTIGATION_LLM_TIMEOUT_SECONDS: ${INVESTIGATION_LLM_TIMEOUT_SECONDS:-180}
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_PAYPAL_MODE: ${NEXT_PUBLIC_PAYPAL_MODE:-sandbox}

volumes:
  postgres_data:
